{% extends "base.html" %}

{% block content %}
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">Удалить тип пищи</h3>
            </div>
            <div class="card-body">
                <p>Вы уверены, что хотите удалить тип пищи "{{ object.name }}"?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Удалить</button>
                    <a href="{% url 'feeding:food_item_list' %}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Отмена</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
