{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">{% if object %}Редактировать требования{% else %}Добавить требования{% endif %}</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% crispy form %}
                </form>
            </div>
        </div>
    </div>
{% endblock %}
