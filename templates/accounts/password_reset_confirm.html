{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Новый пароль — Terrarium Manager{% endblock %}

{% block content %}
<div class="tm-auth">
    <h1>Новый пароль</h1>
    <p class="lede">Придумайте надёжный пароль для входа в аккаунт.</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Сохранить пароль</button>
    </form>
</div>
{% endblock %}
