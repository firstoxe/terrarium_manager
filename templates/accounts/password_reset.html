{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Сброс пароля — Terrarium Manager{% endblock %}

{% block content %}
<div class="tm-auth">
    <h1>Сброс пароля</h1>
    <p class="lede">Укажите email — пришлём инструкции по восстановлению.</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Отправить инструкции</button>
    </form>
    <div class="text-center mt-3 small">
        <a href="{% url 'accounts:login' %}">Вернуться ко входу</a>
    </div>
</div>
{% endblock %}
