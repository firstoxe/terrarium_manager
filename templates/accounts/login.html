{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Вход — Terrarium Manager{% endblock %}

{% block content %}
<div class="tm-auth">
    <h1>Вход</h1>
    <p class="lede">Войдите, чтобы вести коллекцию, кормления и справочник видов.</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Войти</button>
    </form>
    <div class="text-center mt-3 small">
        <a href="{% url 'accounts:register' %}">Создать аккаунт</a>
        ·
        <a href="{% url 'accounts:password_reset' %}">Забыли пароль?</a>
    </div>
</div>
{% endblock %}
