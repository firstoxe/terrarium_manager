{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h5>Профиль пользователя</h5>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <strong>Имя пользователя:</strong> {{ user.username }}
                    </li>
                    <li class="list-group-item">
                        <strong>Email:</strong> {{ user.email|default:"не указан" }}
                    </li>
                    <li class="list-group-item">
                        <strong>Телефон:</strong> {{ user.phone|default:"не указан" }}
                    </li>
                </ul>
                <div class="card-footer">
                    <a href="{% url 'accounts:profile_edit' %}" class="btn btn-warning">
                        <i class="bi bi-pencil-square me-2"></i>Редактировать
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
