{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Редактирование профиля — Terrarium Manager{% endblock %}

{% block content %}
<div class="tm-page-header">
    <div>
        <h1>Редактирование профиля</h1>
        <p class="tm-page-lede">Имя, контакты и основные данные аккаунта.</p>
    </div>
</div>

<div class="tm-form-card" style="max-width:640px">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="tm-form-actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
