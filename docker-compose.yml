services:
  web:
    build: .
    expose:
      - "8000"
    env_file: .env
    environment:
      USE_REDIS: "True"
      REDIS_URL: redis://redis:6379
      REDIS_SELECT2_URL: redis://redis:6379/2
    depends_on:
      - db
      - redis
    volumes:
      - media_data:/app/media

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/media:ro
    depends_on:
      - web

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: terrarium_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  celery:
    build: .
    command: celery -A terrarium_manager worker -l info
    env_file: .env
    environment:
      USE_REDIS: "True"
      REDIS_URL: redis://redis:6379
      REDIS_SELECT2_URL: redis://redis:6379/2
    depends_on:
      - db
      - redis
    volumes:
      - media_data:/app/media

  celery-beat:
    build: .
    command: celery -A terrarium_manager beat -l info
    env_file: .env
    environment:
      USE_REDIS: "True"
      REDIS_URL: redis://redis:6379
      REDIS_SELECT2_URL: redis://redis:6379/2
    depends_on:
      - db
      - redis

volumes:
  pg_data:
  media_data:
