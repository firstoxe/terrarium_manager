[project]
name = "terrarium-manager"
version = "0.1.0"
description = "Django app for terrarium animal management"
readme = "README.md"
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "terrarium_manager.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --tb=short"
