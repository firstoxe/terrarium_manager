{% extends "base.html" %}
{% load django_tables2 %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h3 class="mb-0">Список таксонов</h3>
            <a href="{% url 'animals:taxonomy_create' %}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Добавить таксон
            </a>
        </div>
        <div class="card-body">
            {% render_table table %}
        </div>
    </div>
</div>
{% endblock %}
