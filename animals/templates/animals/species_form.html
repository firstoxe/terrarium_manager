{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load static crispy_forms_tags %}

{% block content %}
<div class="container-lg mt-4">
    <div class="card shadow-lg">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">
                <i class="bi bi-plus-circle me-2"></i>Добавление нового вида
            </h3>
        </div>
        <div class="card-body">
            <form method="post" class="form-horizontal">
                {% csrf_token %}

                <div class="row g-3">
                    <div class="col-md-6">
                        {{ form.name|as_crispy_field }}
                    </div>
                    <div class="col-md-6">
                    </div>
                </div>

                <div class="form-actions mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-lg flex-grow-1">
                        <i class="bi bi-save me-2"></i>Сохранить вид
                    </button>
                    <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-x-circle me-2"></i>Отмена
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Автоматическая генерация научного названия
    const nameField = document.getElementById('id_name');
    const sciNameField = document.getElementById('id_scientific_name');

    nameField.addEventListener('blur', function() {
        if (!sciNameField.value) {
            const generatedName = nameField.value
                .toLowerCase()
                .replace(/ /g, '-')
                .replace(/[^a-z-]/g, '');
            sciNameField.value = generatedName;
        }
    });
});
</script>
{% endblock %}
