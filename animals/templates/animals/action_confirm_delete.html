{% extends "base.html" %}

{% block content %}
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">Удалить действие</h3>
            </div>
            <div class="card-body">
                <p>Вы уверены, что хотите удалить действие "{{ object.get_action_type_display }}" от {{ object.date|date:"d.m.Y H:i" }}?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Удалить</button>
                    <a href="{% url 'animals:animal_detail' object.animal.pk %}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Отмена</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
