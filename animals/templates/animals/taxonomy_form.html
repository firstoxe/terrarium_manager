{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h3 class="mb-0">{% if form.instance.pk %}Редактировать таксон{% else %}Добавить таксон{% endif %}</h3>
        </div>
        <div class="card-body">
                {% csrf_token %}
                {% crispy form %}
        </div>
    </div>
</div>
{% endblock %}
