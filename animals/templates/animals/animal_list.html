{% extends "base.html" %}
{% load render_table from django_tables2 %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-grid"></i> Мои животные</h1>
        <a href="{% url 'animals:create' %}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Добавить
        </a>
    </div>

    {% render_table table %}
</div>
{% endblock %}

{% block extra_scripts %}
<style>
.animal-thumbnail {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 5px;
}
.table td, .table th {
    vertical-align: middle;
}
</style>
{% endblock %}
