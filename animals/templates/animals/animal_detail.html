{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h3 class="mb-0">{{ object.name }}</h3>
            <div>
                <a href="{% url 'animals:update' object.pk %}" class="btn btn-sm btn-warning">
                    <i class="bi bi-pencil"></i>
                </a>
                <a href="{% url 'animals:delete' object.pk %}" class="btn btn-sm btn-danger">
                    <i class="bi bi-trash"></i>
                </a>
            </div>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-4">
                    {% if object.photo %}
                    <img src="{{ object.photo.url }}" class="img-fluid rounded">
                    {% endif %}
                </div>
                <div class="col-md-8">
                    <dl class="row">
                        <dt class="col-sm-3">Вид</dt>
                        <dd class="col-sm-9">{{ object.species }}</dd>

                        <dt class="col-sm-3">Пол</dt>
                        <dd class="col-sm-9">{{ object.get_sex_display }}</dd>

                        <dt class="col-sm-3">Дата рождения</dt>
                        <dd class="col-sm-9">{{ object.birth_date|date:"d.m.Y" }}</dd>

                        <dt class="col-sm-3">Заметки</dt>
                        <dd class="col-sm-9">{{ object.notes|linebreaks }}</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
